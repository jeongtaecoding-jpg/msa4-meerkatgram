spring:
  application:
    name: msa4-meerkatgram
    version: v1

  # 파일 크기 늘리기
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # DB(MySQL)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:meerkatgram}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:msa505}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 커넥션 풀 설정
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # JPA
  jpa:
    hibernate:
      # 서버 재시작 할 때, DB 스키마를 어떻게 관리할지 설정
      # `none` 이외의 설정 값을 사용시, DB 스키마가 초기화 되거나 수정되므로 요주의
      ddl-auto: none
    # 실행되는 SQL을 콘솔에 출력 여부
    show-sql: true
    properties:
      hibernate:
        # SQL을 보기 좋게 포맷하여 출력
        format_sql: true
        default_batch_fetch_size: 100
      # 데이터 소스 초기화 지연 설정
      # - true로 설정 시, Spring 컨텍스트가 완전히 로드된 후에 어플리케이션의 DataSource 초기화
    defer-datasource-initialization: true

  sql:
    init:
      # DB 초기화 파일의 위치 설정
      data-locations: classpath*:dummy/*.sql
      # DB 초기화 파일이 실행될 시점을 설정
      mode: always
      # 사용할 DB 플랫폼 설정
      platform: all

server:
  error:
    include-stacktrace: always
    include-message: always

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml        # mapper 패키지가 배포 및 위치(배포)하는 경로
  type-aliases-package: com.msa4meerkatgram.domain

# Log
logging:
  file:
    # 로그 파일 경로
    name: logs/error.log
  level:
    # 로그 출력 레벨 설정 (trace, debug, info, warn, error)
    # 레벨을 설정하면 거기서부터 제일 아래까지 출력 된다. (예시 : trace면 그냥 전부 다 출력됨)
    root: info

    # 특정 패키지만 로그 출력 레벨 설정
    com.msa4meerkatgram.controllers: debug

# Security & JWT
security:
  jwt:
    secure: false    # 개발중일 땐 false, 운영중일 땐 true
    issuer: meerkat@merkat.kr
    type: JWT
    access-token-expiry: 100000000
    refresh-token-expiry: 1296000000
    refresh-token-cookie-name: refresh-token
    refresh-token-cookie-expiry: 1296000
    secret: ${JWT_SECRET:34589hf72349q8925h8q39f5h72934hf59q28h346f5983qo4gfo53q4g53q4g}
    header-key: Authorization
    scheme: Bearer
    reiss-uri: /api/reissue-token

# file
file:
  server-uri: ${SERVER_URI:http://localhost:8080}
  storage-path: C:/Users/jeongtae/workspace/msa4-meerkatgram/storage
  profile-path: /files/profiles
  post-path: /files/posts
  allow-extension-list: [
    "image/jpg",
    "image/jpeg",
    "image/png",
    "image/gif",
    "image/svg",
    "image/webp"
  ]

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}   # 도메인
  max-age: 3600






